spring.application.name=jira-clone

# For Developement
# jwt.secretkey=${abcdefghijklmnopqrstuvwxyz1234567890}
jwt.secretkey=${JWT_SECRET_KEY}

#server.servlet.context-path=/api/v1

#DB configuration
spring.datasource.url=jdbc:mysql://localhost:3306/jira_clone
# For Developement
# spring.datasource.username=${root}
# spring.datasource.password=${root}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
# This will create schema on running your application and will also drop all schemas once you stop your application
spring.jpa.show-sql=true
#TO see all the SQL statements run by hibernate
spring.jpa.properties.hibernate.format_sql=true //Format the hibernate queries, statements


#server.servlet.context-path=/api
